name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Decode Keystore
      env:
        ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$ENCODED_KEYSTORE" ]; then
          echo "::error::KEYSTORE_BASE64 secret is not set. The release build cannot be signed."
          exit 1
        fi
        echo "$ENCODED_KEYSTORE" | base64 -di > keystore.jks
        echo "Keystore decoded successfully."
        ls -la keystore.jks

    # app/build.gradle.kts signs the release build from KEYSTORE_PATH +
    # KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD when the keystore file
    # exists; without them the release APK is built unsigned.
    - name: Build Signed Release APK
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
        KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew assembleGmsMobileUniversalRelease --no-daemon --stacktrace

    - name: Verify APK was produced
      id: verify_apk
      run: |
        echo "=== Searching for built APK files ==="
        find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null || true
        APK_COUNT=$(find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | wc -l)
        if [ "$APK_COUNT" -eq 0 ]; then
          echo "::error::No APK was produced. The build failed to generate an output artifact."
          exit 1
        fi
        echo "=== APK count: $APK_COUNT ==="

        # Store-friendly, versioned name for the universal APK (Uptodown/
        # APKPure/APKMirror submissions all want an explicit version in the
        # filename).
        VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
        UNIVERSAL_APK=$(find app/build/outputs/apk -name "*universal*.apk" -type f | head -1)
        if [ -n "$UNIVERSAL_APK" ]; then
          cp "$UNIVERSAL_APK" "Vela-v${VERSION_NAME}-universal.apk"
          echo "Renamed universal APK -> Vela-v${VERSION_NAME}-universal.apk"
          ls -lh "Vela-v${VERSION_NAME}-universal.apk"
        fi

        for apk in $(find app/build/outputs/apk -name "*.apk" -type f); do
          echo "APK: $apk"
          ls -lh "$apk"
        done
        echo "apk_count=$APK_COUNT" >> $GITHUB_OUTPUT

    - name: Verify APK signature
      run: |
        APK=$(ls Vela-v*-universal.apk | head -1)
        if [ -z "$APK" ]; then
          echo "::error::No universal APK to verify."
          exit 1
        fi
        "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK"

    - name: Upload Signed Release APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Vela-Universal-APK
        path: |
          Vela-v*-universal.apk
          app/build/outputs/apk/**/*.apk
        if-no-files-found: error
        retention-days: 30
        compression-level: 0

    - name: Cleanup Keystore
      if: always()
      run: |
        rm -f keystore.jks
        echo "Keystore cleaned up."
